name: Checks
on: [push, pull_request]
jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qttest
      - run: python -m unittest discover -s tests -v
      - run: python -m json.tool manifest.json > /dev/null
      - name: Test color spectrum interactions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: /usr/lib/qt6/bin/qmltestrunner -input tests/qml -o -,txt
